<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VScafe</title>
  <link rel="stylesheet" href="cafe.css">
</head>

<body>
  <header class="header" id="home">
    <h1>VS cafe</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#Offers">Offers</a>
      <a href="#Contact">Contact</a>
    </nav>
  </header>
  <main id="home">
    <section id="menu" class="menu">
      <h2>Our Special Dishes</h2>
      <div class="menu-container">
        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1613564834361-9436948817d1?q=80&w=1943&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="">
          <h3>Veggiepizza</h3>
          <p>Delisious Cheesy Pizza </p>
          <p>$179</p>
          <button>Order Now</button>
        </article>
        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=1981&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="">
          <h3>Specialpizza</h3>
          <p>Delisious Cheesy Pizza </p>
          <p>$200</p>
          <button>Order Now</button>
        </article>
        <article class="card">
          <img
            src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="">
          <h3>Cheesy pizza</h3>
          <p>Delisious Cheesy Pizza </p>
          <p>$100</p>
          <button>Order Now</button>
        </article>
      </div>


    </section>

    <section id="Offers">
      <h2>Special Offers</h2>
      <table>
        <tr>
          <th>Food</th>
          <th>Price</th>
        </tr>
        <tr>
          <td>Pizza</td>
          <td>$179</td>
        </tr>
        <tr>
          <td>Garlic Bread</td>
          <td>$1</td>
        </tr>
      </table>
    </section>

    <section id="Contact">
      <h2>Contact Us</h2>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Enter Your Email">
        <textarea placeholder="Your Message"></textarea>
        <button type="submit">Submit</button>
      </form>


    </section>










  </main>
</body>

</html>
